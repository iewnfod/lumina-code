# lumina-server — 生产用 compose：拉取 CI 发布的镜像直接运行。
#
#   docker compose up -d                                # 首次运行自动建卷
#   docker compose pull && docker compose up -d          # 更新到新版 :latest
#
# 打开 http://<host>:4600/ 注册第一个账号（自动成为 admin）。数据就是
# 卷里的 lumina.db 一个文件，备份即拷贝。TLS/组网见 server/README.md。
#
# 镜像由 .github/workflows/docker-server.yml 自动构建推送：
# master 推送 → :edge；GitHub Release → :<版本号> + :latest。
# 想锁定版本就把下面的 tag 换成具体版本号（如 0.5.0）。
#
# 从源码自建镜像？见 server/README.md 的构建段
# （docker build -f server/Dockerfile -t lumina-code-server .）。

services:
  lumina-server:
    image: iewnfod/lumina-code-server:latest
    ports:
      - "4600:3000"
    environment:
      LUMINA_DATA_DIR: /data
      # Set to "false" to close registration after everyone joined.
      LUMINA_ALLOW_REGISTRATION: "true"
      # "1" only when this port is TLS itself (no reverse proxy).
      LUMINA_COOKIE_SECURE: "0"
      # frp 远程访问：必须与 server/deploy/frps.toml 的 auth.token 一致
      # （留空 = 服务器不提供远程访问）。bindPort 默认 7000。
      LUMINA_FRPS_TOKEN: "CHANGE_ME_TOO"
    volumes:
      - lumina-data:/data
    restart: unless-stopped

  # frp 服务端：桌面 frpc 的出站信道 + 移动端直连的 vhost 路由。
  # 配置见 server/deploy/frps.toml（改 auth.token）。
  frps:
    image: fatedier/frps:0.61.1
    restart: unless-stopped
    command: -c /etc/frps/frps.toml
    volumes:
      - ./server/deploy/frps.toml:/etc/frps/frps.toml:ro
    ports:
      # frpc 控制信道（公网可达；frpc 侧启用 TLS）
      - "7000:7000"
      # HTTP vhost —— 只绑宿主机回环，nginx 的 /t/ 路由从这里转发
      - "127.0.0.1:7100:7100"

volumes:
  lumina-data:
