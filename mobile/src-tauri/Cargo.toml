[package]
name = "lumina-code-mobile"
version = "0.7.1"
description = "Lumina Code mobile client (remote companion for lumina-code-server)"
authors = ["iewnfod"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique vs. the bin (same pattern
# as the webkit shell's crate).
name = "lumina_code_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Stable crates.io pin (aligned with the desktop shell's lock) — on the
# ohos target this is REDIRECTED to the feat/open-harmony branch by the
# [patch.crates-io] block below (tauri-build decides the `mobile` cfg
# alias: the stable one knows only ios/android and would silently drop
# the #[ability] napi glue on ohos).
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# OHOS PATCH LINE: while HarmonyOS support rides the official
# `feat/open-harmony` branches, tauri must stay EXACTLY `=2.11.5` —
# that is the version the branch's crates publish (verified against the
# branch's Cargo.toml 2026-11-02), and the patch mechanism only
# replaces the precise version cargo selected. A looser req resolves to
# a newer crates.io release (2.11.6+) that BYPASSES the patch — the
# classic ohos-port trap. When the branch merges upstream: drop the `=`
# pin back onto the desktop lock's line and delete the patch block.
# The npm-side parity check stays satisfied (crate 2.11.5 vs npm
# @tauri-apps/cli 2.11.x — major/minor parity).
tauri = { version = "=2.11.5", features = [] }
# NOT a real dependency: pins wry to exactly 0.56.0 (the branch's
# version) so the [patch.crates-io] below actually applies — crates.io
# has a newer 0.56.1 that satisfies tauri-runtime-wry's `^0.56` and
# would silently bypass the patch (the unused-patch trap; the ohos
# build then compiles the stable wry's webkit2gtk path for the
# linux-flavored ohos target and dies on pkg-config/glib).
wry = { version = "=0.56.0", default-features = false }
tauri-plugin-opener = "=2.5.5"
# File-backed persisted state — `=`-pinned to the desktop lock's resolved
# version. 2.4.3, NOT 2.5.x: 2.5.0 requires tauri ^2.12 while this repo
# stays on the 2.11 line (mobile's =2.11.5 + npm @tauri-apps/api 2.11.x
# alignment, see mobile/src-tauri/Cargo.toml; lumina-terminal runs the
# same 2.4.3 against tauri 2.11.2). Bump together with package.json.
tauri-plugin-store = "=2.4.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The #[ability] macro (via tauri::mobile_entry_point's ohos expansion)
# generates code referencing these directly — same 1.1 line as the
# vendored openharmony-ability so the napi types unify.
napi-ohos = { version = "1.1", features = ["napi8"] }
napi-derive-ohos = "1.1"

# Plugins that are NOT built for the ohos target at all: log
# SIGABRTs on ohos during initialization (live-bisected 2026-10-05,
# see lib.rs), and os/dialog/notification carry linux-target native
# dependency paths (dialog's linux path pulls the gtk stack) that have
# never been verified against the ohos target — keeping them out of
# the ohos resolve graph entirely is the only safe shape. The
# npm-side imports of these degrade gracefully (every invoke fails and
# is caught). Re-add one at a time behind a verified ohos build.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
tauri-plugin-log = "=2.9.2"
tauri-plugin-os = "=2.3.2"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-notification = "=2.4.0"

# --- HarmonyOS (OpenHarmony) support ---------------------------------
#
# Tauri's ohos support lives on the official `feat/open-harmony`
# branches of tauri/wry/tao (based on tauri 2.11.5 / wry 0.56.0 /
# tao 0.36.0 — NOT yet merged into a crates.io release). The patch
# below redirects those three crates (plus tauri-build, see
# build-dependencies) to the branch.
#
# VERSIONS MUST STAY EXACT (`=2.11.5`): the patch mechanism only
# replaces the precise version cargo selected, so a looser `^2.11`
# resolves to a newer crates.io release that BYPASSES the patch —
# the classic ohos-port trap (see mobile/README.md's toolchain notes).
#
# This patch table is scoped to THIS crate's workspace: the webkit
# shell (src-tauri) and the CEF shell (cef/src-tauri) are separate
# workspaces and resolve their own (stable) dependency graphs.
#
# When the branch merges upstream: delete the patch block, bump to the
# release that includes ohos, and drop the `=` pin.

[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }
wry = { git = "https://github.com/tauri-apps/wry", branch = "feat/open-harmony" }
# LUMINA: tao is vendored (the openharmony-ability pattern above) because
# the stock ohos backend's theme support is a stub — Window::theme() is a
# hardcoded Theme::Light and the ConfigChanged arm only forwards
# ScaleFactorChanged, so the system dark/light mode never reaches tauri's
# window.theme()/onThemeChanged (and through them the web frontend's
# useSystemTheme). The vendor carries exactly two LUMINA changes (marked
# with LUMINA comments): theme() reads the live app config's color mode,
# and ConfigChanged also emits WindowEvent::ThemeChanged on real theme
# transitions. Re-sync with the branch + re-apply those two when bumping.
tao = { path = "../vendor/tao" }
# CRITICAL: tauri-build decides the `mobile` cfg alias — the STABLE
# crates.io tauri-build knows only ios/android and emits `desktop` for
# the ohos target, which silently drops the #[ability] napi glue from
# mobile_entry_point (the app then installs but stays blank: no
# init/render napi exports). Must be patched alongside tauri.
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/open-harmony" }

# The branch wry's ohos backend rides on harmony-contrib's
# openharmony-ability (git-only crate). Its HEAD has since REMOVED the
# `webview` feature the branch requires, and cargo refuses a
# same-source patch — so the exact rev the wry branch's own Cargo.lock
# was built against (295a276a, version 0.3.0) is VENDORED at
# mobile/vendor/openharmony-ability and patched in by path (the
# cef/src-tauri/vendor pattern). Bump only together with the wry branch.
[patch."https://github.com/harmony-contrib/openharmony-ability.git"]
openharmony-ability = { path = "../vendor/openharmony-ability/crates/ability" }
openharmony-ability-derive = { path = "../vendor/openharmony-ability/crates/derive" }
