[package]
name = "lumina-code"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumina_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.2", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.3", features = ["devtools"] }
# CEF (Chromium Embedded Framework) runtime — cef branch feasibility probe.
# v3 unbundles the webview runtime from tauri; the app picks one here.
# CEF runs gtk4 + X11 on Linux, so tauri-plugin-dialog must avoid its default
# gtk3 feature (GTK 3 and GTK 4 cannot be initialized in the same process).
tauri-runtime-cef = { version = "3.0.0-alpha.4", features = ["devtools"] }
tauri-plugin-opener = "3.0.0-alpha.1"
tauri-plugin-os = "3.0.0-alpha.1"
tauri-plugin-log = "3.0.0-alpha.1"
tauri-plugin-dialog = { version = "=3.0.0-alpha.1", default-features = false, features = ["xdg-portal"] }
tauri-plugin-notification = "3.0.0-alpha.1"

# cef 分支：tauri-plugin-dialog 的 xdg-portal feature 路径缺 `use tauri::Manager`
# （上游 CI 只测默认 gtk3 feature，未覆盖该路径 —— alpha.1/alpha.2 同病）。
# 本地 vendored 副本只补了这一行 import，升级插件版本时优先移除此 patch。
[patch.crates-io]
tauri-plugin-dialog = { path = "vendor/tauri-plugin-dialog" }
# lumina-code cef branch 本地补丁之二：Linux 下 CEF 浏览器的 X 子窗口吃掉全部
# 按钮事件，gtk4-winit 的 drag_window 因 "requires a pointer button press"
# 永远失败（上游 #14936，崩溃已修但拖动仍不可用）。补丁在 StartDragging 分发处
# 直接发 EWMH _NET_WM_MOVERESIZE，详见 vendor 内 start_window_drag 的注释。
# 升级 runtime 版本时优先检查上游是否已修，再决定保留或移除此 patch。
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }

# The Linux notification sender's persistent D-Bus connection — see
# src/notify.rs for why the plugin's per-send connection gets GNOME
# notifications destroyed. Already in the tree via notify-rust; same
# default features, so this adds no new code.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
