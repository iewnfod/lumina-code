[package]
name = "lumina-code"
version = "0.10.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumina_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the system tray (src/tray.rs) — close-to-tray keeps the opencode
# server and frpc alive while the window is hidden. image-png: decodes the
# embedded CO wordmark tray icon (icons/tray.png) via Image::from_bytes.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Single desktop instance (release builds only — see lib.rs): a second launch
# wakes the hidden main window instead of starting a second opencode server
# (two servers sharing the opencode storage cause transiently empty reads).
tauri-plugin-single-instance = "2"
# Tray menu / notification copy language detection (no transitive deps).
sys-locale = "0.3"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The lumina-code-server HTTP transport (lumina_http.rs — see its header for why
# those requests must NOT ride the webview's network stack). Default
# features carry native-tls (the curl-proven OpenSSL stack).
reqwest = { version = "0.12", default-features = true }
tauri-plugin-store = "=2.4.3"

# The Linux notification sender's persistent D-Bus connection — see
# src/notify.rs for why the plugin's per-send connection gets GNOME
# notifications destroyed. Already in the tree via notify-rust; same
# default features, so this adds no new code.
#
# The native window-blur path (src/background_effect.rs) — the
# ext-background-effect-v1 Wayland protocol spoken over GDK's own
# connection. `system` selects the FFI backend (foreign-display
# support); `staging` unlocks the protocol bindings (0.32.9+). gtk is
# tauri 2's own GTK3 line (0.18) — only used for the widget walk down
# to the GdkWindow (the Wayland accessors themselves are dlopen'd).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["staging", "client"] }
gtk = "0.18"
libloading = "0.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
