name: Debug ARM AppImage

# TEMPORARY diagnostics workflow — do not ship in a release.
# Reproduces the release.yml ubuntu-22.04-arm leg (and ONLY that leg, no
# tauri-action, no asset upload) with TAURI_CLI_VERBOSITY=2 so the bundler
# streams linuxdeploy's stdout/stderr into the log. The default verbosity
# discards it, which is why the release run only shows the useless
# `failed to run linuxdeploy`.
# Delete this file once the root cause is found and fixed.
on:
  workflow_dispatch:

concurrency:
  group: debug-appimage-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm-appimage:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      # Deviation from release.yml: cache the toolchain builds so repeated
      # diagnostic runs don't pay the full Rust compile every time.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch OpenCode sidecar (aarch64-unknown-linux-gnu)
        run: pnpm fetch:opencode aarch64-unknown-linux-gnu

      # THE FIX (v2): no patchelf rewrite of the Go sidecar is loadable on
      # native 64K-page aarch64 kernels — even patchelf 0.19.1's corrected
      # layout segfaults the loader under --list (verified on the runner:
      # ldd exits 1 with zero output = the trace crashed). The sidecar's
      # rpath is useless anyway (its deps are all blacklisted system libs),
      # so intercept $PATCHELF with a wrapper that no-ops --set-rpath for
      # the sidecar and forwards everything else to real patchelf 0.19.1.
      - name: Install patchelf with sidecar skip wrapper
        run: |
          curl -fsSL -o "$RUNNER_TEMP/patchelf.tgz" \
            https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-aarch64.tar.gz
          mkdir -p "$RUNNER_TEMP/patchelf-dir"
          tar -xzf "$RUNNER_TEMP/patchelf.tgz" -C "$RUNNER_TEMP/patchelf-dir"
          real="$(find "$RUNNER_TEMP/patchelf-dir" -type f -name patchelf | head -1)"
          chmod +x "$real"
          "$real" --version
          wrapper="$RUNNER_TEMP/patchelf-wrapper"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            "real=\"$real\"" \
            'if [ "$1" = "--set-rpath" ] && [ "$#" -ge 3 ] && [ "${3##*/}" = "opencode" ]; then' \
            '  echo "patchelf-wrapper: skipping --set-rpath for sidecar $3" >&2' \
            '  exit 0' \
            'fi' \
            'exec "$real" "$@"' > "$wrapper"
          chmod +x "$wrapper"
          # smoke test: skip branch fires for a file named opencode (never
          # reaches the real patchelf), forwarding branch runs --version
          touch "$RUNNER_TEMP/opencode"
          "$wrapper" --set-rpath '$ORIGIN/../lib' "$RUNNER_TEMP/opencode"
          "$wrapper" --version
          echo "PATCHELF=$wrapper" >> "$GITHUB_ENV"

      # Second half of the fix: linuxdeploy's bundled (static binutils) strip
      # also mangles the Go sidecar, and getStripPath() has no env override —
      # NO_STRIP skips the phase entirely. Cost: ~75 kB of unstripped Go
      # symbols (the Rust binary strips itself via Cargo's strip=true).
      - name: Build AppImage with verbose bundler logs
        env:
          NO_STRIP: "1"
        run: pnpm tauri build --target aarch64-unknown-linux-gnu --verbose --verbose

      # Forensics: linuxdeploy discards ldd's stderr, so after a failure (or
      # success) inspect the exact sidecar binary the walk choked on — on the
      # native 64K-page kernel, not under emulation.
      - name: Forensics on the AppDir sidecar
        if: always()
        run: |
          f="src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/Lumina Code.AppDir/usr/bin/opencode"
          if [ ! -f "$f" ]; then echo "no AppDir sidecar (bundle never reached it)"; exit 0; fi
          ls -la "$f"
          file "$f"
          echo '--- program headers:'
          readelf -l "$f" | grep -A1 'LOAD'
          echo '--- dynamic:'
          readelf -d "$f" | grep -iE 'needed|runpath|rpath'
          echo '--- ldd (output may be empty if the trace crashes):'
          ldd "$f" || echo "ldd exit=$?"
          echo '--- loader --list (bypasses the ldd script):'
          /lib/ld-linux-aarch64.so.1 --list "$f" || echo "loader exit=$?"

      # On failure the AppDir is the crime scene (how far linuxdeploy got,
      # which libs it copied). On success the AppImage itself is the proof.
      - name: Upload bundle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-appimage-bundle
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/
          if-no-files-found: ignore
          retention-days: 3
