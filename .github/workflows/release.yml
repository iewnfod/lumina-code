name: Release

# Builds the app for every desktop target and uploads the bundles to an
# EXISTING GitHub release (create it with hand-written notes first; this
# workflow only attaches assets). The `tag` input makes workflow_dispatch
# re-runnable for a specific release without re-publishing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build (e.g. v0.1.0)"
        required: true
        type: string

# Whatever triggered us, the release to attach assets to is identified by its
# tag: the dispatch input when given, else the published release's ref name.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # THE lumina-code difference: fetch the pinned OpenCode server sidecar
      # for the EXACT matrix target (the macOS x86_64 leg cross-compiles on
      # an arm64 runner, so host detection would fetch the wrong binary).
      # Tauri's externalBin bundling requires
      # src-tauri/binaries/opencode-<target>[.exe] to exist before the build;
      # scripts/fetch-opencode.mjs verifies the npm tarball's sha512 against
      # the registry-published integrity.
      - name: Fetch OpenCode sidecar (${{ matrix.target }})
        run: pnpm fetch:opencode ${{ matrix.target }}

      # aarch64-unknown-linux-gnu only: the Go sidecar's ELF (64K-aligned
      # PT_LOADs, Go's aarch64 layout) cannot survive ANY patchelf rewrite —
      # linuxdeploy's bundled patchelf corrupts it during --set-rpath, and
      # even patchelf 0.19.1's corrected layout segfaults the loader on
      # native 64K-page kernels (verified: ldd dies with zero output). The
      # x86_64 sidecar is 4K-aligned and unaffected, which is why the amd64
      # leg always worked. The sidecar's rpath is useless anyway (its deps
      # are blacklisted system libs), so intercept linuxdeploy's $PATCHELF
      # hook with a wrapper that no-ops --set-rpath for the sidecar and
      # forwards everything else to real patchelf 0.19.1; NO_STRIP skips
      # linuxdeploy's bundled strip phase (it mangles the Go binary too,
      # and getStripPath() has no env override — cost: ~75 kB of symbols,
      # the Rust binary strips itself via Cargo's strip=true).
      - name: Neutralize patchelf/strip for the ARM sidecar
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/patchelf.tgz" \
            https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-aarch64.tar.gz
          mkdir -p "$RUNNER_TEMP/patchelf-dir"
          tar -xzf "$RUNNER_TEMP/patchelf.tgz" -C "$RUNNER_TEMP/patchelf-dir"
          real="$(find "$RUNNER_TEMP/patchelf-dir" -type f -name patchelf | head -1)"
          chmod +x "$real"
          "$real" --version
          wrapper="$RUNNER_TEMP/patchelf-wrapper"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            "real=\"$real\"" \
            'if [ "$1" = "--set-rpath" ] && [ "$#" -ge 3 ] && [ "${3##*/}" = "opencode" ]; then' \
            '  exit 0' \
            'fi' \
            'exec "$real" "$@"' > "$wrapper"
          chmod +x "$wrapper"
          touch "$RUNNER_TEMP/opencode"
          "$wrapper" --set-rpath '$ORIGIN/../lib' "$RUNNER_TEMP/opencode"
          "$wrapper" --version
          echo "PATCHELF=$wrapper" >> "$GITHUB_ENV"
          echo "NO_STRIP=1" >> "$GITHUB_ENV"

      # Snapshot the hand-written release title and body BEFORE tauri-action
      # runs. We feed them straight back to tauri-action (releaseName /
      # releaseBody) so whatever it writes back is identical to what we read —
      # the notes you wrote in the GitHub UI are preserved. Reading is
      # idempotent across the concurrent matrix jobs since every job re-reads
      # the same values up front.
      - name: Read existing release title and notes
        id: release_meta
        env:
          # GITHUB_TOKEN (built-in) with the job's contents: write permission
          # is sufficient — no PAT needed for reading release metadata.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Force bash on every OS: the command substitution + heredoc below are
        # bash syntax, which the Windows runner's default shell (PowerShell) can't run.
        shell: bash
        run: |
          # title (single line) → steps.release_meta.outputs.name
          name="$(gh release view '${{ env.RELEASE_TAG }}' --json name --jq '.name')"
          # body (multiline) → steps.release_meta.outputs.body
          body="$(gh release view '${{ env.RELEASE_TAG }}' --json body --jq '.body')"
          {
            echo "name=$name"
            # multiline value: use the delimiter form so newlines survive
            echo "body<<BODY_EOF"
            echo "$body"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Builds + bundles (deb/rpm/AppImage, NSIS, dmg/app) and uploads the
      # artifacts to the release. NO updater signing env here — lumina-code
      # does not configure the Tauri updater (no createUpdaterArtifacts /
      # plugins.updater in tauri.conf.json). When the updater is enabled,
      # add TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # secrets to this env block alongside the config changes.
      - name: Build tauri app and upload artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          # Echo back the exact title/notes we snapshotted above so the action's
          # internal release update is a no-op on metadata — only assets change.
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: ${{ steps.release_meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Post-publish tripwire (added after a v0.1.1 incident where a Linux
  # package ended up with a WRONG binary as its "opencode"): assert the
  # shipped layout is exactly the private-resource design —
  #   ① NO usr/bin/opencode member (the old externalBin layout: installing
  #     it pollutes PATH and collides with a user-installed opencode),
  #   ② the private sidecar usr/lib/Lumina Code/opencode IS present,
  #     executable (0755) and an ELF,
  #   ③ on the runner-matching arch (amd64) the sidecar actually runs and
  #     reports the pinned version.
  # Any violation fails the release run loudly instead of shipping broken
  # packages to AUR/COPR users.
  verify-linux-assets:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install inspection tools
        run: |
          sudo apt-get update
          # libarchive-tools provides bsdtar (not on ubuntu runners by default).
          sudo apt-get install -y libarchive-tools rpm2cpio cpio

      - name: Read the pinned OpenCode version
        id: pin
        run: |
          pin="$(grep -oP '(?<=const EXPECTED_OPENCODE_VERSION: &str = ")[^"]+' src-tauri/src/opencode/mod.rs)"
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"
          echo "pinned OpenCode version: ${pin}"

      - name: Download and verify Linux assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pin="${{ steps.pin.outputs.pin }}"
          work="${RUNNER_TEMP}/verify"
          mkdir -p "${work}"
          fail=0

          verify_layout() {
            # $1 = label, $2 = listing with modes (one line per member),
            # $3 = sidecar path prefix as it appears in the listing
            local label="$1" listing="$2" prefix="$3"
            echo "::group::layout: ${label}"
            if grep -qE '(^|[[:space:]])\./?usr/bin/opencode([[:space:]]|$)' "${listing}"; then
              echo "FAIL: ${label} installs usr/bin/opencode — PATH pollution regression"
              fail=1
            fi
            if ! grep -F "usr/lib/Lumina Code/opencode" "${listing}"; then
              echo "FAIL: ${label} is missing the private sidecar usr/lib/Lumina Code/opencode"
              fail=1
            else
              mode="$(grep -F 'usr/lib/Lumina Code/opencode' "${listing}" | head -1 | awk '{print $1}')"
              if [ "${mode#-}" != "rwxr-xr-x" ]; then
                echo "FAIL: ${label} sidecar mode is ${mode#-}, expected rwxr-xr-x"
                fail=1
              else
                echo "ok: private sidecar present, mode ${mode#-}"
              fi
            fi
            echo "::endgroup::"
          }

          for arch in amd64 arm64; do
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "Lumina.Code*${arch}.deb" --dir "${work}" --clobber
            # The asset filename carries the APP version, which can differ
            # from the tag (republish suffixes like v0.1.2-2 vs assets named
            # ..._0.1.2_...) — resolve the downloaded file by glob instead
            # of computing the name from the tag.
            f=""
            for candidate in "${work}"/*"${arch}.deb"; do
              if [ -f "${candidate}" ]; then f="${candidate}"; break; fi
            done
            if [ -z "${f}" ]; then
              echo "FAIL: no ${arch} deb asset found on ${RELEASE_TAG}"
              fail=1
              continue
            fi
            bsdtar -xOf "${f}" 'data.tar.*' | bsdtar -tvf - > "${work}/deb-${arch}.list"
            verify_layout "deb ${arch}" "${work}/deb-${arch}.list" ""
            # Extract the sidecar for ELF/exec checks.
            bsdtar -xOf "${f}" 'data.tar.*' \
              | bsdtar -xOf - 'usr/lib/Lumina Code/opencode' > "${work}/sidecar-${arch}"
            magic="$(head -c4 "${work}/sidecar-${arch}" | od -An -tx1 | tr -d '[:space:]')"
            if [ "${magic}" != "7f454c46" ]; then
              echo "FAIL: deb ${arch} sidecar is not an ELF (magic ${magic})"
              fail=1
            fi
            # Only the runner-matching arch can actually execute here.
            if [ "${arch}" = "amd64" ]; then
              chmod +x "${work}/sidecar-${arch}"
              got="$("${work}/sidecar-${arch}" --version)"
              if [ "${got}" != "opencode v${pin}" ]; then
                echo "FAIL: deb amd64 sidecar reports '${got}', expected 'opencode v${pin}'"
                fail=1
              else
                echo "ok: deb amd64 sidecar runs, ${got}"
              fi
            fi
          done

          for arch in x86_64 aarch64; do
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "Lumina.Code-*${arch}.rpm" --dir "${work}" --clobber
            # Same as the deb loop: resolve the downloaded file by glob —
            # the asset's embedded version may differ from the tag.
            f=""
            for candidate in "${work}"/*"${arch}.rpm"; do
              if [ -f "${candidate}" ]; then f="${candidate}"; break; fi
            done
            if [ -z "${f}" ]; then
              echo "FAIL: no ${arch} rpm asset found on ${RELEASE_TAG}"
              fail=1
              continue
            fi
            # rpm2cpio STREAMS the payload; cpio stops reading at the cpio
            # TRAILER and closes the pipe, killing rpm2cpio with SIGPIPE
            # (exit 141) — fatal under `set -o pipefail` and silent with
            # stderr hidden. Stage the cpio payload to a file first and
            # feed cpio from it (verified: the pipe form dies 141 locally).
            rpm2cpio "${f}" > "${work}/rpm-${arch}.cpio"
            cpio -itv --quiet < "${work}/rpm-${arch}.cpio" > "${work}/rpm-${arch}.list" 2>/dev/null
            verify_layout "rpm ${arch}" "${work}/rpm-${arch}.list" ""
            d="${work}/rpm-${arch}"
            mkdir -p "${d}"
            (cd "${d}" && cpio -idm --quiet < "${work}/rpm-${arch}.cpio")
            if [ ! -f "${d}/usr/lib/Lumina Code/opencode" ]; then
              echo "FAIL: rpm ${arch} extraction missing sidecar"
              fail=1
            else
              mode="$(stat -c '%A' "${d}/usr/lib/Lumina Code/opencode")"
              if [ "${mode}" != "-rwxr-xr-x" ]; then
                echo "FAIL: rpm ${arch} sidecar mode is ${mode}, expected -rwxr-xr-x"
                fail=1
              fi
            fi
          done

          if [ "${fail}" -ne 0 ]; then
            echo "::error::Linux asset layout verification FAILED — see the FAIL lines above"
            exit 1
          fi
          echo "All Linux assets verified: private sidecar layout intact."
