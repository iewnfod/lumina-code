name: Release

# Builds the app for every desktop target (plus the Android APK via the
# publish-android job) and uploads the bundles to an EXISTING GitHub release
# (create it with hand-written notes first; this workflow only attaches
# assets). The `tag` input makes workflow_dispatch re-runnable for a
# specific release without re-publishing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build (e.g. v0.1.0)"
        required: true
        type: string

# Whatever triggered us, the release to attach assets to is identified by its
# tag: the dispatch input when given, else the published release's ref name.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default (webkit) shell — every desktop target.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # The CEF (Chromium) shell — Linux only. mac/win keep their system
          # webviews (already Chromium-grade there); CEF would only add
          # ~200 MB. deb+rpm only: CEF + AppImage/linuxdeploy is unproven,
          # revisit after the flavor has shipped once.
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm"
            shell: cef
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu --bundles deb,rpm"
            shell: cef

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (webkit shell)
        if: runner.os == 'Linux' && matrix.shell != 'cef'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xdg-utils

      # The CEF shell links gtk4 (+ its X11 backend) instead of the
      # webkit2gtk/gtk3 stack; cef-dll-sys needs cmake + a C++ compiler for
      # libcef_dll_wrapper (both preinstalled on GitHub runners).
      - name: Install Linux dependencies (CEF shell)
        if: runner.os == 'Linux' && matrix.shell == 'cef'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # THE lumina-code difference: fetch the pinned OpenCode server sidecar
      # for the EXACT matrix target (the macOS x86_64 leg cross-compiles on
      # an arm64 runner, so host detection would fetch the wrong binary).
      # Tauri's externalBin bundling requires
      # src-tauri/binaries/opencode-<target>[.exe] to exist before the build;
      # scripts/fetch-opencode.mjs verifies the npm tarball's sha512 against
      # the registry-published integrity.
      - name: Fetch OpenCode sidecar (${{ matrix.target }})
        env:
          # The CEF shell bundles from cef/src-tauri/binaries (its own copy —
          # the bundler resolves resources relative to the crate); empty for
          # the webkit shell, whose fetch script default applies.
          LUMINA_BINARIES_DIR: ${{ matrix.shell == 'cef' && 'cef/src-tauri/binaries' || '' }}
        run: pnpm fetch:opencode ${{ matrix.target }}

      # The frpc resource sidecar (remote access), same per-target pattern
      # and same LUMINA_BINARIES_DIR redirect for the CEF leg. Go binary —
      # the same patchelf pitfalls as the opencode sidecar below apply.
      - name: Fetch frpc sidecar (${{ matrix.target }})
        env:
          LUMINA_BINARIES_DIR: ${{ matrix.shell == 'cef' && 'cef/src-tauri/binaries' || '' }}
        run: pnpm fetch:frp ${{ matrix.target }}

      # aarch64-unknown-linux-gnu only: the Go sidecar's ELF (64K-aligned
      # PT_LOADs, Go's aarch64 layout) cannot survive ANY patchelf rewrite —
      # linuxdeploy's bundled patchelf corrupts it during --set-rpath, and
      # even patchelf 0.19.1's corrected layout segfaults the loader on
      # native 64K-page kernels (verified: ldd dies with zero output). The
      # x86_64 sidecar is 4K-aligned and unaffected, which is why the amd64
      # leg always worked. The sidecar's rpath is useless anyway (its deps
      # are blacklisted system libs), so intercept linuxdeploy's $PATCHELF
      # hook with a wrapper that no-ops --set-rpath for the sidecar and
      # forwards everything else to real patchelf 0.19.1; NO_STRIP skips
      # linuxdeploy's bundled strip phase (it mangles the Go binary too,
      # and getStripPath() has no env override — cost: ~75 kB of symbols,
      # the Rust binary strips itself via Cargo's strip=true).
      - name: Neutralize patchelf/strip for the ARM sidecar
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/patchelf.tgz" \
            https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-aarch64.tar.gz
          mkdir -p "$RUNNER_TEMP/patchelf-dir"
          tar -xzf "$RUNNER_TEMP/patchelf.tgz" -C "$RUNNER_TEMP/patchelf-dir"
          real="$(find "$RUNNER_TEMP/patchelf-dir" -type f -name patchelf | head -1)"
          chmod +x "$real"
          "$real" --version
          wrapper="$RUNNER_TEMP/patchelf-wrapper"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            "real=\"$real\"" \
            'if [ "$1" = "--set-rpath" ] && [ "$#" -ge 3 ] && [ "${3##*/}" = "opencode" ]; then' \
            '  exit 0' \
            'fi' \
            'exec "$real" "$@"' > "$wrapper"
          chmod +x "$wrapper"
          touch "$RUNNER_TEMP/opencode"
          "$wrapper" --set-rpath '$ORIGIN/../lib' "$RUNNER_TEMP/opencode"
          "$wrapper" --version
          echo "PATCHELF=$wrapper" >> "$GITHUB_ENV"
          echo "NO_STRIP=1" >> "$GITHUB_ENV"

      # Snapshot the hand-written release title and body BEFORE tauri-action
      # runs. We feed them straight back to tauri-action (releaseName /
      # releaseBody) so whatever it writes back is identical to what we read —
      # the notes you wrote in the GitHub UI are preserved. Reading is
      # idempotent across the concurrent matrix jobs since every job re-reads
      # the same values up front.
      - name: Read existing release title and notes
        id: release_meta
        env:
          # GITHUB_TOKEN (built-in) with the job's contents: write permission
          # is sufficient — no PAT needed for reading release metadata.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Force bash on every OS: the command substitution + heredoc below are
        # bash syntax, which the Windows runner's default shell (PowerShell) can't run.
        shell: bash
        run: |
          # title (single line) → steps.release_meta.outputs.name
          name="$(gh release view '${{ env.RELEASE_TAG }}' --json name --jq '.name')"
          # body (multiline) → steps.release_meta.outputs.body
          body="$(gh release view '${{ env.RELEASE_TAG }}' --json body --jq '.body')"
          {
            echo "name=$name"
            # multiline value: use the delimiter form so newlines survive
            echo "body<<BODY_EOF"
            echo "$body"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Builds + bundles (deb/rpm/AppImage, NSIS, dmg/app) and uploads the
      # artifacts to the release. NO updater signing env here — lumina-code
      # does not configure the Tauri updater (no createUpdaterArtifacts /
      # plugins.updater in tauri.conf.json). When the updater is enabled,
      # add TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # secrets to this env block alongside the config changes.
      - name: Build tauri app and upload artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          # Echo back the exact title/notes we snapshotted above so the action's
          # internal release update is a no-op on metadata — only assets change.
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: ${{ steps.release_meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          # The CEF shell lives in cef/ (its own package root so the tauri
          # CLI's src-tauri discovery finds the right crate).
          projectPath: ${{ matrix.shell == 'cef' && 'cef' || '.' }}
          args: ${{ matrix.args }}

  # The Android app (mobile/) — its own job because tauri-action does not
  # drive `tauri android build`; we invoke the CLI directly and upload via
  # gh. Produces ONE APK for arm64 (every modern phone; the other ABIs would
  # quadruple the rust cross-compile for a negligible audience) named
  # Lumina.Code_<ver>_android-arm64.apk, version-synced with the desktop via
  # scripts/bump-version.sh. The APK must be SIGNED to install: the four
  # ANDROID_KEYSTORE_* secrets feed keystore.properties + the keystore file,
  # which the conditional signingConfig in gen/android/app/build.gradle.kts
  # picks up (the official Tauri android-signing pattern — a local build
  # works the same way by writing keystore.properties by hand).
  publish-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ensures the Android SDK + sdkmanager exist even if the runner image
      # drops its preinstalled copy; ANDROID_HOME comes preset either way.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # The tauri CLI needs a concrete NDK version dir. GitHub's ubuntu
      # images ship side-by-side NDKs under $ANDROID_HOME/ndk — pick the
      # newest and fail loudly if the image ever stops shipping one (the
      # fix would be an explicit `sdkmanager --install "ndk;<ver>"` here).
      - name: Accept licenses and resolve NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          ndk="$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -1)"
          if [ -z "$ndk" ]; then
            echo "::error::No NDK found under $ANDROID_HOME/ndk — install one via sdkmanager and retry."
            exit 1
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "using NDK $ndk"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Fail FAST when the signing secrets are missing: an unsigned APK in a
      # release is a broken deliverable (it cannot be installed at all), so
      # an explanatory error beats shipping a dead asset. One-time setup
      # (keep the .jks safe — Android upgrades require the SAME signature).
      # NOTE: modern keytool emits PKCS12, which does NOT support a key
      # password distinct from the store password — pass the SAME value to
      # -storepass and -keypass, and set ANDROID_KEYSTORE_PASSWORD and
      # ANDROID_KEY_PASSWORD to that one password (a mismatch fails gradle
      # with "Given final block not properly padded", live-observed):
      #   keytool -genkey -v -keystore lumina-release.jks \
      #     -keyalg RSA -keysize 2048 -validity 10000 -alias lumina \
      #     -storepass <password> -keypass <password>
      #   gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -w0 lumina-release.jks)
      #   gh secret set ANDROID_KEYSTORE_PASSWORD  # the -storepass value
      #   gh secret set ANDROID_KEY_ALIAS          # e.g. lumina
      #   gh secret set ANDROID_KEY_PASSWORD       # the SAME password (PKCS12)
      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set — the release APK cannot be signed."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Set the four ANDROID_KEYSTORE_* secrets (see this step's comments for the one-time commands), then re-run this workflow."
            exit 1
          fi

      # keystore.properties is what the committed signingConfig in
      # gen/android/app/build.gradle.kts reads; both files are gitignored
      # by the tauri template, so writing them here leaves no trace.
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gen="mobile/src-tauri/gen/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$gen/lumina-release.jks"
          cat > "$gen/keystore.properties" <<EOF
          storeFile=lumina-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # The CLI resolves the mobile project from mobile/ (src-tauri next
      # door); beforeBuildCommand (pnpm run build:mobile) walks up pnpm's
      # package chain to the repo root. No opencode/frpc sidecar fetch here:
      # the mobile shell bundles neither. NDK_HOME/ANDROID_NDK_HOME come
      # from the resolve step above (written via GITHUB_ENV).
      - name: Build Android APK (aarch64)
        working-directory: mobile
        run: pnpm exec tauri android build --apk --target aarch64

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' mobile/src-tauri/tauri.conf.json | head -n1)"
          # tauri's per-target APK output lands under apk/universal/ even for
          # a single --target (live-observed: --target aarch64 →
          # outputs/apk/universal/release/app-universal-release.apk).
          src="mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::APK not found at $src"
            exit 1
          fi
          asset="Lumina.Code_${ver}_android-arm64.apk"
          cp "$src" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
          echo "uploaded $asset"

  # Post-publish tripwire (added after a v0.1.1 incident where a Linux
  # package ended up with a WRONG binary as its "opencode"): assert the
  # shipped layout is exactly the private-resource design —
  #   ① NO usr/bin/opencode member (the old externalBin layout: installing
  #     it pollutes PATH and collides with a user-installed opencode),
  #   ② the private sidecar usr/lib/Lumina Code/opencode IS present,
  #     executable (0755) and an ELF,
  #   ③ on the runner-matching arch (amd64) the sidecar actually runs and
  #     reports the pinned version.
  # Any violation fails the release run loudly instead of shipping broken
  # packages to AUR/COPR users.
  verify-linux-assets:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install inspection tools
        run: |
          sudo apt-get update
          # libarchive-tools provides bsdtar (not on ubuntu runners by
          # default). bsdtar reads BOTH .deb and .rpm payloads (libarchive
          # handles rpm incl. zstd) — no rpm2cpio/cpio: Ubuntu's rpm2cpio
          # is an ancient script without zstd support, and cpio exits
          # non-zero on warnings, which pipefail turns into silent deaths.
          sudo apt-get install -y libarchive-tools

      - name: Read the pinned OpenCode version
        id: pin
        run: |
          pin="$(grep -oP '(?<=const EXPECTED_OPENCODE_VERSION: &str = ")[^"]+' src-tauri/src/opencode/mod.rs)"
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"
          echo "pinned OpenCode version: ${pin}"

      - name: Download and verify Linux assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pin="${{ steps.pin.outputs.pin }}"
          work="${RUNNER_TEMP}/verify"
          mkdir -p "${work}"
          fail=0

          # Both shipped flavors: the default webkit shell and the CEF shell.
          # ASSET names are DOTTED for both ("Lumina.Code_*…",
          # "Lumina.Code.CEF_*…"): GitHub's release-asset upload replaces
          # spaces with dots, so even the tauri v3 bundler's spaced LOCAL
          # filenames ("Lumina Code CEF_…") arrive dotted. Each flavor's
          # globs are ANCHORED on the separator right after the dotted base
          # so one flavor can never swallow the other's assets — a bare
          # "Lumina.Code*amd64.deb" also matches "Lumina.Code.CEF_…_amd64.deb",
          # which fed the CEF deb to the webkit checks on v0.3.0. The
          # IN-PACKAGE paths (libdir) keep their spaces — only the asset
          # filename is sanitized. The CEF flavor additionally must carry
          # the Chromium runtime (libcef.so).
          verify_layout() {
            # $1 = label, $2 = listing with modes (one line per member),
            # $3 = private lib dir as it appears in the listing,
            # $4 = require libcef.so (cef) or not (webkit)
            local label="$1" listing="$2" libdir="$3" need_libcef="$4"
            echo "::group::layout: ${label}"
            if grep -qE '(^|[[:space:]])\./?usr/bin/opencode([[:space:]]|$)' "${listing}"; then
              echo "FAIL: ${label} installs usr/bin/opencode — PATH pollution regression"
              fail=1
            fi
            if ! grep -F "usr/lib/${libdir}/opencode" "${listing}"; then
              echo "FAIL: ${label} is missing the private sidecar usr/lib/${libdir}/opencode"
              fail=1
            else
              mode="$(grep -F "usr/lib/${libdir}/opencode" "${listing}" | head -1 | awk '{print $1}')"
              if [ "${mode#-}" != "rwxr-xr-x" ]; then
                echo "FAIL: ${label} sidecar mode is ${mode#-}, expected rwxr-xr-x"
                fail=1
              else
                echo "ok: private sidecar present, mode ${mode#-}"
              fi
            fi
            if [ "${need_libcef}" = "1" ] && ! grep -F "libcef.so" "${listing}"; then
              echo "FAIL: ${label} (CEF) carries no libcef.so — the Chromium runtime must ship in the package"
              fail=1
            fi
            echo "::endgroup::"
          }

          for flavor in webkit cef; do
            case "${flavor}" in
              webkit) deb_pre="Lumina.Code_";     rpm_pre="Lumina.Code-";     libdir="Lumina Code";     need_libcef=0 ;;
              cef)    deb_pre="Lumina.Code.CEF_"; rpm_pre="Lumina.Code.CEF-"; libdir="Lumina Code CEF"; need_libcef=1 ;;
            esac

            for arch in amd64 arm64; do
              # Non-fatal on a no-match (gh exits 1) — the glob resolution
              # below turns a missing download into an explicit FAIL instead
              # of pipefail killing the whole verification run.
              gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
                --pattern "${deb_pre}*${arch}.deb" --dir "${work}" --clobber || true
              # The asset filename carries the APP version, which can differ
              # from the tag (republish suffixes like v0.1.2-2 vs assets named
              # ..._0.1.2_...) — resolve the downloaded file by glob instead
              # of computing the name from the tag.
              f=""
              for candidate in "${work}/${deb_pre}"*"${arch}.deb"; do
                if [ -f "${candidate}" ]; then f="${candidate}"; break; fi
              done
              if [ -z "${f}" ]; then
                echo "FAIL: no ${deb_pre}*${arch}.deb asset found on ${RELEASE_TAG}"
                fail=1
                continue
              fi
              bsdtar -xOf "${f}" 'data.tar.*' | bsdtar -tvf - > "${work}/deb-${flavor}-${arch}.list"
              verify_layout "deb ${flavor} ${arch}" "${work}/deb-${flavor}-${arch}.list" "${libdir}" "${need_libcef}"
              # Extract the sidecar for ELF/exec checks. Non-fatal on a
              # missing member (the listing check above already FAILED it) —
              # bsdtar's non-zero exit under pipefail would otherwise kill
              # the script mid-run, like it did on the v0.3.0 run.
              bsdtar -xOf "${f}" 'data.tar.*' \
                | bsdtar -xOf - "usr/lib/${libdir}/opencode" \
                > "${work}/sidecar-${flavor}-${arch}" || true
              if [ ! -s "${work}/sidecar-${flavor}-${arch}" ]; then
                echo "FAIL: deb ${flavor} ${arch} sidecar did not extract (missing member)"
                fail=1
                continue
              fi
              magic="$(head -c4 "${work}/sidecar-${flavor}-${arch}" | od -An -tx1 | tr -d '[:space:]')"
              if [ "${magic}" != "7f454c46" ]; then
                echo "FAIL: deb ${flavor} ${arch} sidecar is not an ELF (magic ${magic})"
                fail=1
                continue
              fi
              # Only the runner-matching arch can actually execute here;
              # a failed exec must surface as a FAIL, not kill the script.
              if [ "${arch}" = "amd64" ]; then
                chmod +x "${work}/sidecar-${flavor}-${arch}"
                got="$("${work}/sidecar-${flavor}-${arch}" --version 2>/dev/null || true)"
                if [ "${got}" != "opencode v${pin}" ]; then
                  echo "FAIL: deb ${flavor} amd64 sidecar reports '${got}', expected 'opencode v${pin}'"
                  fail=1
                else
                  echo "ok: deb ${flavor} amd64 sidecar runs, ${got}"
                fi
              fi
            done

            for arch in x86_64 aarch64; do
              # Non-fatal on a no-match — see the deb loop above.
              gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
                --pattern "${rpm_pre}*${arch}.rpm" --dir "${work}" --clobber || true
              # Same as the deb loop: resolve the downloaded file by glob —
              # the asset's embedded version may differ from the tag.
              f=""
              for candidate in "${work}/${rpm_pre}"*"${arch}.rpm"; do
                if [ -f "${candidate}" ]; then f="${candidate}"; break; fi
              done
              if [ -z "${f}" ]; then
                echo "FAIL: no ${rpm_pre}*${arch}.rpm asset found on ${RELEASE_TAG}"
                fail=1
                continue
              fi
              # bsdtar reads the rpm payload directly (modes preserved).
              bsdtar -tvf "${f}" > "${work}/rpm-${flavor}-${arch}.list"
              verify_layout "rpm ${flavor} ${arch}" "${work}/rpm-${flavor}-${arch}.list" "${libdir}" "${need_libcef}"
            done
          done

          # The webkit rpm legs extract + stat the sidecar (mode check beyond
          # the listing) — kept from the original tripwire. Non-fatal: a
          # missing download must fall through to the [ ! -f ] FAIL below.
          d="${work}/rpm-webkit-x86_64"
          mkdir -p "${d}"
          (cd "${d}" && bsdtar -xf "${work}/Lumina.Code-"*"x86_64.rpm") || true
          if [ ! -f "${d}/usr/lib/Lumina Code/opencode" ]; then
            echo "FAIL: rpm webkit x86_64 extraction missing sidecar"
            fail=1
          else
            mode="$(stat -c '%A' "${d}/usr/lib/Lumina Code/opencode")"
            if [ "${mode}" != "-rwxr-xr-x" ]; then
              echo "FAIL: rpm webkit x86_64 sidecar mode is ${mode}, expected -rwxr-xr-x"
              fail=1
            fi
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "::error::Linux asset layout verification FAILED — see the FAIL lines above"
            exit 1
          fi
          echo "All Linux assets verified (both flavors): private sidecar layout intact."
