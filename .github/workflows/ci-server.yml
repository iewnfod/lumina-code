name: CI - lumina-server

# Verifies the self-hosted companion server (server/ — a pnpm workspace
# member): vitest over its pure lib (auth/sync/transcript/db) plus a
# production `next build`. Fast, single-OS like ci-frontend.yml — the
# server is platform-agnostic Node; the Docker image build is a release
# concern, not a per-commit check.

on:
  push:
  pull_request:

# Same dedup/cancel policy as the other CI workflows.
concurrency:
  group: ci-server-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  server:
    name: lumina-server (vitest + next build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server tests
        run: pnpm server:test

      - name: Build server
        run: pnpm server:build
