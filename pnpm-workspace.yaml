# The lumina-code-server Next.js app is a workspace member so the whole repo
# shares one lockfile (the desktop app stays the root package; the CEF
# shell keeps its own isolated package because its CLI pin is
# major-version-incompatible with the root's).
packages:
  - "server"

# pnpm v10+ blocks dependency scripts by default; these are explicitly
# decided (allowBuilds) so pnpm stops re-writing a pending placeholder that
# fails its run-time deps check. better-sqlite3 compiles/downloads a native
# addon; esbuild installs its platform binary (feeds
# scripts/build-plugin-vendor.mjs).
allowBuilds:
  better-sqlite3: true
  esbuild: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
